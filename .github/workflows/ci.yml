name: Embedded CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]

jobs:
  # Job pentru analiza structurii de directoare modificate
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      shared: ${{ steps.filter.outputs.shared }}
      coordinator: ${{ steps.filter.outputs.coordinator }}
      light_switch: ${{ steps.filter.outputs.light_switch }}
      bmp180: ${{ steps.filter.outputs.bmp180 }}
      bmp180_device: ${{ steps.filter.outputs.bmp180_device }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Filter Paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            shared:
              - 'shared_components/**'
              - '.github/workflows/ci.yml'
            coordinator:
              - 'zigbee_network/network_coordinator/**'
              - '.github/workflows/ci.yml'
            light_switch:
              - 'zigbee_end_device/light_switch/**'
              - '.github/workflows/ci.yml'
            bmp180:
              - 'zigbee_end_device/bmp180/**'
              - '.github/workflows/ci.yml'
            bmp180_device:
              - 'zigbee_end_device/bmp180_device/**'
              - '.github/workflows/ci.yml'

  # 1. Host-Side Unit Tests
  run-tests:
    name: Run Unit Tests
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.shared == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4 

      - name: Install GCC & Build Tools
        run: sudo apt-get update && sudo apt-get install -y build-essential

      - name: Compile Tests
        run: |
          gcc -I./shared_components/include \
              -I./shared_components/unity \
              ./shared_components/src/payload_parser.c \
              ./shared_components/unity/unity.c \
              ./shared_components/tests/test_payload_parser.c \
              -o test_run

      - name: Run Unit Tests
        run: ./test_run 

  # 2. nRF Connect SDK Firmware Compilation
  build-firmware:
    name: Build Firmware
    runs-on: ubuntu-latest
    needs: [detect-changes, run-tests]
    if: always() && (needs.run-tests.result == 'success' || needs.run-tests.result == 'skipped')
    strategy:
      fail-fast: false
      matrix:
        include:
          - app-name: "Network Coordinator"
            app-path: "zigbee_network/network_coordinator"
            sysbuild: true
            id: "coordinator"
          - app-name: "Light Switch"
            app-path: "zigbee_end_device/light_switch"
            sysbuild: true
            id: "light_switch"
          - app-name: "BMP180 Application"
            app-path: "zigbee_end_device/bmp180"
            sysbuild: false
            id: "bmp180"
          - app-name: "BMP180 Device"
            app-path: "zigbee_end_device/bmp180_device"
            sysbuild: true
            id: "bmp180_device"

    container:
      image: nordicplayground/nrfconnect-sdk:v2.9-branch

    steps:
      - name: Evaluate Build Necessity
        id: check
        run: |
          SHARED_CHANGED="${{ needs.detect-changes.outputs.shared }}"
          APP_CHANGED="${{ needs.detect-changes.outputs[matrix.id] }}"
          if [ "$SHARED_CHANGED" = "true" ] || [ "$APP_CHANGED" = "true" ]; then
            echo "run_build=true" >> $GITHUB_OUTPUT
          else
            echo "run_build=false" >> $GITHUB_OUTPUT
          fi

      - name: Checkout Code
        if: steps.check.outputs.run_build == 'true'
        uses: actions/checkout@v4
        with:
          path: project

      - name: Initialize CCache
        if: steps.check.outputs.run_build == 'true'
        uses: actions/cache@v4
        with:
          path: /root/.cache/ccache
          key: ccache-${{ matrix.app-path }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ matrix.app-path }}-

      - name: Debug Environment
        if: steps.check.outputs.run_build == 'true'
        run: |
          pwd
          echo "github workspace: ${{ github.workspace }}"
          ls -la ${{ github.workspace }} || true
          ls -la /workdir || true
          find ${{ github.workspace }} -maxdepth 3 || true

      - name: Build Firmware (Sysbuild)
        if: steps.check.outputs.run_build == 'true' && matrix.sysbuild == true
        run: |
          cd /workdir
          HOME=/root nrfutil toolchain-manager launch -- west build -b nrf52840dk/nrf52840 -s $GITHUB_WORKSPACE/project/${{ matrix.app-path }} -d $GITHUB_WORKSPACE/project/${{ matrix.app-path }}/build --sysbuild

      - name: Build Firmware (Standard)
        if: steps.check.outputs.run_build == 'true' && matrix.sysbuild == false
        run: |
          cd /workdir
          HOME=/root nrfutil toolchain-manager launch -- west build -b nrf52840dk/nrf52840 -s $GITHUB_WORKSPACE/project/${{ matrix.app-path }} -d $GITHUB_WORKSPACE/project/${{ matrix.app-path }}/build

      - name: Upload Build Artifacts
        if: steps.check.outputs.run_build == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app-name }}-firmware
          path: |
            project/${{ matrix.app-path }}/build/**/zephyr.hex
            project/${{ matrix.app-path }}/build/**/zephyr.bin
            project/${{ matrix.app-path }}/build/**/zephyr.elf