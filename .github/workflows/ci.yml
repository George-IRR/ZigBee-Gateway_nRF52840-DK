name: Embedded CI/CD Pipeline

on: [push]

jobs:
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      shared: ${{ steps.filter.outputs.shared }}
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      has_changes: ${{ steps.set-matrix.outputs.has_changes }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Filter Paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          base: develop
          filters: |
            shared:
              - 'shared_components/**'
              - '.github/workflows/ci.yml'
            coordinator:
              - 'zigbee_network/network_coordinator/**'
              - '.github/workflows/ci.yml'
            light_switch:
              - 'zigbee_end_device/light_switch/**'
              - '.github/workflows/ci.yml'
            bmp180:
              - 'zigbee_end_device/bmp180/**'
              - '.github/workflows/ci.yml'
            bmp180_device:
              - 'zigbee_end_device/bmp180_device/**'
              - '.github/workflows/ci.yml'

      - name: Generate Dynamic Matrix
        id: set-matrix
        run: |
          SHARED="${{ steps.filter.outputs.shared }}"
          COORDINATOR="${{ steps.filter.outputs.coordinator }}"
          LIGHT_SWITCH="${{ steps.filter.outputs.light_switch }}"
          BMP180="${{ steps.filter.outputs.bmp180 }}"
          BMP180_DEVICE="${{ steps.filter.outputs.bmp180_device }}"
          
          JSON="[]"
          
          add_to_matrix() {
            JSON=$(echo "$JSON" | jq -c ". + [{\"app-name\": \"$1\", \"app-path\": \"$2\", \"sysbuild\": $3, \"id\": \"$4\"}]")
          }
          
          if [ "$SHARED" = "true" ] || [ "$COORDINATOR" = "true" ]; then
            add_to_matrix "Network Coordinator" "zigbee_network/network_coordinator" true "coordinator"
          fi
          if [ "$SHARED" = "true" ] || [ "$LIGHT_SWITCH" = "true" ]; then
            add_to_matrix "Light Switch" "zigbee_end_device/light_switch" true "light_switch"
          fi
          if [ "$SHARED" = "true" ] || [ "$BMP180" = "true" ]; then
            add_to_matrix "BMP180 Application" "zigbee_end_device/bmp180" false "bmp180"
          fi
          if [ "$SHARED" = "true" ] || [ "$BMP180_DEVICE" = "true" ]; then
            add_to_matrix "BMP180 Device" "zigbee_end_device/bmp180_device" false "bmp180_device"
          fi
          
          if [ "$JSON" = "[]" ]; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "matrix={\"include\":[]}" >> $GITHUB_OUTPUT
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "matrix={\"include\":$JSON}" >> $GITHUB_OUTPUT
          fi

  # 1. Host-Side Unit Tests
  run-tests:
    name: Run Unit Tests
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.shared == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4 

      - name: Install GCC & Build Tools
        run: sudo apt-get update && sudo apt-get install -y build-essential

      - name: Compile Tests
        run: |
          gcc -I./shared_components/include \
              -I./shared_components/unity \
              ./shared_components/src/payload_parser.c \
              ./shared_components/unity/unity.c \
              ./shared_components/tests/test_payload_parser.c \
              -o test_run

      - name: Run Unit Tests
        run: ./test_run 

  # 2. nRF Connect SDK Firmware Compilation
  build-firmware:
    name: Build Firmware
    runs-on: ubuntu-latest
    needs: [detect-changes, run-tests]
    if: |
      always() && 
      (needs.run-tests.result == 'success' || needs.run-tests.result == 'skipped') &&
      needs.detect-changes.outputs.has_changes == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.detect-changes.outputs.matrix) }}

    container:
      image: nordicplayground/nrfconnect-sdk:v2.9-branch

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          path: project

      - name: Initialize CCache
        uses: actions/cache@v4
        with:
          path: /root/.cache/ccache
          key: ccache-${{ matrix.app-path }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ matrix.app-path }}-

      - name: Build Firmware (Sysbuild)
        if: matrix.sysbuild == true
        run: |
          cd /workdir
          HOME=/root nrfutil toolchain-manager launch -- west build -b nrf52840dk/nrf52840 -s $GITHUB_WORKSPACE/project/${{ matrix.app-path }} -d $GITHUB_WORKSPACE/project/${{ matrix.app-path }}/build --sysbuild

      - name: Build Firmware (Standard)
        if: matrix.sysbuild == false
        run: |
          cd /workdir
          HOME=/root nrfutil toolchain-manager launch -- west build -b nrf52840dk/nrf52840 -s $GITHUB_WORKSPACE/project/${{ matrix.app-path }} -d $GITHUB_WORKSPACE/project/${{ matrix.app-path }}/build

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app-name }}-firmware
          path: |
            project/${{ matrix.app-path }}/build/**/zephyr.hex
            project/${{ matrix.app-path }}/build/**/zephyr.bin
            project/${{ matrix.app-path }}/build/**/zephyr.elf