name: PlantUML CI

on:
  push:
    paths:
      - 'Docs/*.puml' # Only trigger in Docs

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Generate SVGs into Diagram_out subdirectory
      - name: Generate PlantUML (SVG)
        uses: docker://plantuml/plantuml
        with:
          args: -tsvg -o "Diagram_out" "Docs/*.puml"

      # Save artifacts (local execution only)
      - name: Upload Generated Diagrams
        if: ${{ env.ACT }}
        uses: actions/upload-artifact@v4
        with:
            name: diagrams
            path: "Docs/Diagram_out/*.svg"

      # Commit changes (GitHub execution only)
      - name: Commit and Push
        if: ${{ !env.ACT }}
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "ci: auto-generate PlantUML SVG diagrams"